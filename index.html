<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Tetris Roblox Style</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Fredoka One', cursive;
    user-select: none;
    -webkit-user-select: none;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 420px;
    height: 100vh;
    padding: 8px;
    gap: 6px;
  }

  .title {
    font-size: 24px;
    color: #ffd93d;
    text-shadow: 0 0 15px rgba(255, 217, 61, 0.5), 2px 2px 0 #e85d04;
    letter-spacing: 3px;
    text-align: center;
    flex-shrink: 0;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    gap: 8px;
    flex-shrink: 0;
  }

  .stat-box {
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 6px 10px;
    text-align: center;
    border: 2px solid rgba(255,255,255,0.2);
    flex: 1;
    min-width: 0;
  }

  .stat-box h3 {
    font-size: 10px;
    color: #00d4ff;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }

  .stat-box .value {
    font-size: 18px;
    color: #fff;
    text-shadow: 0 0 8px rgba(255,255,255,0.4);
  }

  .board-area {
    position: relative;
    flex-shrink: 0;
  }

  #board {
    border: 3px solid #00d4ff;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
    background: #0a0a1a;
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 280px);
  }

  .next-box {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #ff6b6b;
    border-radius: 8px;
    padding: 4px;
  }

  .next-box h4 {
    font-size: 9px;
    color: #ff6b6b;
    text-align: center;
    margin-bottom: 2px;
    text-transform: uppercase;
  }

  #next {
    display: block;
    width: 60px;
    height: 60px;
  }

  .controls-area {
    width: 100%;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .btn-row {
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  .game-btn {
    background: linear-gradient(145deg, #00d4ff, #0099cc);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    text-transform: uppercase;
    letter-spacing: 1px;
    user-select: none;
    -webkit-user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 #006699, 0 0 10px rgba(0, 212, 255, 0.3);
    position: relative;
    overflow: hidden;
  }

  .game-btn:active, .game-btn.pressed {
    transform: translateY(4px);
    box-shadow: 0 0 0 #006699, 0 0 15px rgba(0, 212, 255, 0.5);
  }

  .game-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,0.15);
    opacity: 0;
    transition: opacity 0.1s;
  }

  .game-btn:active::after, .game-btn.pressed::after {
    opacity: 1;
  }

  .dpad-btn {
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .action-btn {
    height: 48px;
    padding: 0 20px;
    font-size: 13px;
    flex: 1;
    max-width: 140px;
  }

  .drop-btn {
    background: linear-gradient(145deg, #ff6b6b, #cc4444);
    box-shadow: 0 4px 0 #993333, 0 0 10px rgba(255, 107, 107, 0.3);
    height: 48px;
    width: 100%;
    max-width: 200px;
    font-size: 16px;
  }

  .drop-btn:active, .drop-btn.pressed {
    box-shadow: 0 0 0 #993333, 0 0 15px rgba(255, 107, 107, 0.5);
  }

  .drop-btn::after {
    background: rgba(255,255,255,0.15);
  }

  .game-over {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 20px;
  }

  .game-over h2 {
    font-size: 36px;
    color: #ff6b6b;
    margin-bottom: 16px;
    text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
  }

  .game-over p {
    font-size: 20px;
    color: #fff;
    margin-bottom: 24px;
  }

  .game-over .btn {
    background: linear-gradient(145deg, #00d4ff, #0099cc);
    border: none;
    padding: 14px 32px;
    border-radius: 14px;
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 4px 0 #006699, 0 0 20px rgba(0, 212, 255, 0.4);
    transition: transform 0.1s;
  }

  .game-over .btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #006699;
  }

  /* Desktop layout override */
  @media (min-width: 768px) and (min-height: 600px) {
    .game-wrapper {
      flex-direction: row;
      max-width: 900px;
      align-items: flex-start;
      justify-content: center;
      padding: 20px;
      gap: 20px;
      height: auto;
    }

    .title {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 36px;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 180px;
    }

    .top-bar {
      flex-direction: column;
      gap: 10px;
    }

    .stat-box {
      padding: 10px 15px;
    }

    .stat-box h3 {
      font-size: 12px;
    }

    .stat-box .value {
      font-size: 24px;
    }

    .next-box {
      position: static;
      background: rgba(255,255,255,0.1);
      border: 2px solid #ff6b6b;
      border-radius: 12px;
      padding: 10px;
    }

    .next-box h4 {
      font-size: 12px;
    }

    #next {
      width: 100px;
      height: 100px;
    }

    #board {
      max-height: none;
      width: 300px;
      height: 600px;
    }

    .controls-area {
      display: none;
    }

    .desktop-hint {
      display: block;
      color: #ccc;
      font-size: 13px;
      line-height: 1.8;
      text-align: center;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 10px;
    }

    .desktop-hint span {
      color: #ffd93d;
    }
  }

  @media (max-width: 767px) {
    .side-panel {
      display: none;
    }
    .desktop-hint {
      display: none;
    }
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="title">🎮 TETRIS</div>

  <div class="side-panel">
    <div class="top-bar">
      <div class="stat-box">
        <h3>Score</h3>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat-box">
        <h3>Lines</h3>
        <div class="value" id="lines">0</div>
      </div>
      <div class="stat-box">
        <h3>Level</h3>
        <div class="value" id="level">1</div>
      </div>
    </div>
    <div class="next-box">
      <h4>Next</h4>
      <canvas id="next" width="100" height="100"></canvas>
    </div>
    <div class="desktop-hint">
      <span>← →</span> Move &nbsp; <span>↑</span> Rotate<br>
      <span>↓</span> Soft Drop &nbsp; <span>Space</span> Hard Drop<br>
      <span>P</span> Pause
    </div>
  </div>

  <div class="board-area">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="next-box" id="mobileNext">
      <h4>Next</h4>
      <canvas id="nextMobile" width="60" height="60"></canvas>
    </div>
  </div>

  <div class="controls-area">
    <div class="btn-row">
      <button class="game-btn action-btn" id="btnPause">Pause</button>
      <button class="game-btn action-btn" id="btnStart">Start</button>
    </div>
    <div class="btn-row">
      <button class="game-btn dpad-btn" id="btnLeft">←</button>
      <button class="game-btn dpad-btn" id="btnRotate">↻</button>
      <button class="game-btn dpad-btn" id="btnRight">→</button>
    </div>
    <div class="btn-row">
      <button class="game-btn dpad-btn" id="btnDown">↓</button>
    </div>
    <div class="btn-row">
      <button class="game-btn drop-btn" id="btnDrop">DROP ⬇️</button>
    </div>
  </div>
</div>

<div class="game-over" id="gameOver">
  <h2>GAME OVER</h2>
  <p>Score: <span id="finalScore">0</span></p>
  <button class="btn" id="btnRestart">Play Again</button>
</div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nextCtx = nextCanvas ? nextCanvas.getContext('2d') : null;
  const nextMobileCanvas = document.getElementById('nextMobile');
  const nextMobileCtx = nextMobileCanvas ? nextMobileCanvas.getContext('2d') : null;

  const COLS = 10;
  const ROWS = 20;
  const BLOCK_SIZE = 30;

  const COLORS = {
    0: null,
    1: '#FF0000',
    2: '#00FF00',
    3: '#0000FF',
    4: '#FFA500',
    5: '#00FFFF',
    6: '#FF00FF',
    7: '#FFFF00',
  };

  const SHAPES = [
    [],
    [[1,1,0],[0,1,1]],
    [[0,2,2],[2,2,0]],
    [[0,0,3],[3,3,3]],
    [[4,0,0],[4,4,4]],
    [[5,5,5,5]],
    [[0,6,0],[6,6,6]],
    [[7,7],[7,7]]
  ];

  let board = [];
  let currentPiece = null;
  let nextPiece = null;
  let score = 0;
  let lines = 0;
  let level = 1;
  let gameLoop = null;
  let isPaused = false;
  let isGameOver = false;
  let dropCounter = 0;
  let dropInterval = 1000;
  let lastTime = 0;

  function createBoard() {
    board = Array(ROWS).fill().map(() => Array(COLS).fill(0));
  }

  function shadeColor(color, percent) {
    const num = parseInt(color.replace('#', ''), 16);
    const amt = Math.round(2.55 * percent);
    const R = Math.max(0, Math.min(255, (num >> 16) + amt));
    const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
    const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
    return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
  }

  function drawBlock(ctx, x, y, color, size) {
    if (!color) return;
    size = size || BLOCK_SIZE;

    const gradient = ctx.createLinearGradient(x, y, x + size, y + size);
    gradient.addColorStop(0, color);
    gradient.addColorStop(1, shadeColor(color, -30));

    ctx.fillStyle = gradient;
    ctx.fillRect(x, y, size, size);

    ctx.fillStyle = shadeColor(color, 40);
    ctx.fillRect(x, y, size, 3);
    ctx.fillRect(x, y, 3, size);

    ctx.fillStyle = shadeColor(color, -50);
    ctx.fillRect(x + size - 3, y, 3, size);
    ctx.fillRect(x, y + size - 3, size, 3);

    ctx.strokeStyle = shadeColor(color, 20);
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 3, y + 3, size - 6, size - 6);
  }

  function draw() {
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * BLOCK_SIZE, 0);
      ctx.lineTo(i * BLOCK_SIZE, canvas.height);
      ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * BLOCK_SIZE);
      ctx.lineTo(canvas.width, i * BLOCK_SIZE);
      ctx.stroke();
    }

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) {
          drawBlock(ctx, c * BLOCK_SIZE, r * BLOCK_SIZE, COLORS[board[r][c]]);
        }
      }
    }

    if (currentPiece) {
      currentPiece.shape.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            drawBlock(ctx, (currentPiece.x + x) * BLOCK_SIZE, (currentPiece.y + y) * BLOCK_SIZE, COLORS[value]);
          }
        });
      });
    }

    if (currentPiece) {
      let ghostY = currentPiece.y;
      while (isValidMove(currentPiece.shape, currentPiece.x, ghostY + 1)) {
        ghostY++;
      }
      ctx.globalAlpha = 0.25;
      currentPiece.shape.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            drawBlock(ctx, (currentPiece.x + x) * BLOCK_SIZE, (ghostY + y) * BLOCK_SIZE, COLORS[value]);
          }
        });
      });
      ctx.globalAlpha = 1;
    }
  }

  function drawNextPiece() {
    const targetCtx = window.innerWidth < 768 ? nextMobileCtx : nextCtx;
    const targetCanvas = window.innerWidth < 768 ? nextMobileCanvas : nextCanvas;
    if (!targetCtx || !targetCanvas || !nextPiece) return;

    targetCtx.fillStyle = '#0a0a1a';
    targetCtx.fillRect(0, 0, targetCanvas.width, targetCanvas.height);

    const blockSize = window.innerWidth < 768 ? 15 : 25;
    const offsetX = (targetCanvas.width - nextPiece.shape[0].length * blockSize) / 2;
    const offsetY = (targetCanvas.height - nextPiece.shape.length * blockSize) / 2;

    nextPiece.shape.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value) {
          drawBlock(targetCtx, offsetX + x * blockSize, offsetY + y * blockSize, COLORS[value], blockSize);
        }
      });
    });
  }

  function newPiece() {
    const id = Math.floor(Math.random() * 7) + 1;
    return {
      shape: SHAPES[id],
      x: Math.floor((COLS - SHAPES[id][0].length) / 2),
      y: 0,
      id: id
    };
  }

  function isValidMove(shape, x, y) {
    for (let r = 0; r < shape.length; r++) {
      for (let c = 0; c < shape[r].length; c++) {
        if (shape[r][c]) {
          const newX = x + c;
          const newY = y + r;
          if (newX < 0 || newX >= COLS || newY >= ROWS) return false;
          if (newY >= 0 && board[newY][newX]) return false;
        }
      }
    }
    return true;
  }

  function rotatePiece(piece) {
    return piece.shape[0].map((_, i) => piece.shape.map(row => row[i]).reverse());
  }

  function lockPiece() {
    let hitTop = false;
    currentPiece.shape.forEach((row, y) => {
      row.forEach((value, x) => {
        if (value) {
          const boardY = currentPiece.y + y;
          if (boardY < 0) {
            hitTop = true;
          } else {
            board[boardY][currentPiece.x + x] = value;
          }
        }
      });
    });

    if (hitTop) {
      gameOver();
      return;
    }

    clearLines();
    currentPiece = nextPiece;
    nextPiece = newPiece();
    drawNextPiece();

    if (!isValidMove(currentPiece.shape, currentPiece.x, currentPiece.y)) {
      gameOver();
    }
  }

  function clearLines() {
    let linesCleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r].every(cell => cell > 0)) {
        board.splice(r, 1);
        board.unshift(Array(COLS).fill(0));
        linesCleared++;
        r++;
      }
    }

    if (linesCleared > 0) {
      lines += linesCleared;
      score += linesCleared * 100 * level;
      if (linesCleared === 4) score += 400 * level;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(100, 1000 - (level - 1) * 80);
      updateUI();
    }
  }

  function updateUI() {
    document.getElementById('score').textContent = score;
    document.getElementById('lines').textContent = lines;
    document.getElementById('level').textContent = level;
  }

  function gameOver() {
    isGameOver = true;
    cancelAnimationFrame(gameLoop);
    document.getElementById('finalScore').textContent = score;
    document.getElementById('gameOver').style.display = 'flex';
  }

  function startGame() {
    createBoard();
    score = 0;
    lines = 0;
    level = 1;
    dropInterval = 1000;
    isPaused = false;
    isGameOver = false;
    updateUI();
    document.getElementById('gameOver').style.display = 'none';

    currentPiece = newPiece();
    nextPiece = newPiece();
    drawNextPiece();

    lastTime = 0;
    dropCounter = 0;
    gameLoop = requestAnimationFrame(update);
  }

  function pauseGame() {
    isPaused = !isPaused;
  }

  function update(time) {
    if (isPaused || isGameOver) {
      gameLoop = requestAnimationFrame(update);
      return;
    }

    const deltaTime = time - lastTime;
    lastTime = time;
    dropCounter += deltaTime;

    if (dropCounter > dropInterval) {
      if (isValidMove(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
        currentPiece.y++;
      } else {
        lockPiece();
      }
      dropCounter = 0;
    }

    draw();
    gameLoop = requestAnimationFrame(update);
  }

  // ---- CONTROLS ----

  // Keyboard (desktop)
  document.addEventListener('keydown', function(e) {
    if (isGameOver) return;

    switch(e.key) {
      case 'ArrowLeft':
        e.preventDefault();
        if (isValidMove(currentPiece.shape, currentPiece.x - 1, currentPiece.y)) {
          currentPiece.x--;
        }
        break;
      case 'ArrowRight':
        e.preventDefault();
        if (isValidMove(currentPiece.shape, currentPiece.x + 1, currentPiece.y)) {
          currentPiece.x++;
        }
        break;
      case 'ArrowDown':
        e.preventDefault();
        if (isValidMove(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
          currentPiece.y++;
          score += 1;
          updateUI();
        }
        break;
      case 'ArrowUp':
        e.preventDefault();
        const rotated = rotatePiece(currentPiece);
        if (isValidMove(rotated, currentPiece.x, currentPiece.y)) {
          currentPiece.shape = rotated;
        }
        break;
      case ' ':
        e.preventDefault();
        while (isValidMove(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
          currentPiece.y++;
          score += 2;
        }
        lockPiece();
        updateUI();
        break;
      case 'p':
      case 'P':
        e.preventDefault();
        pauseGame();
        break;
    }
  });

  // Touch / Click handlers with debounce to prevent double-fire
  function setupButton(btnId, action) {
    const btn = document.getElementById(btnId);
    if (!btn) return;

    let fired = false;

    function trigger(e) {
      if (e && e.cancelable) e.preventDefault();
      if (fired) return;
      fired = true;
      action();
      btn.classList.add('pressed');
      setTimeout(() => {
        btn.classList.remove('pressed');
        fired = false;
      }, 150);
    }

    // Use touchstart for mobile, click for desktop - never both
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
      btn.addEventListener('touchstart', trigger, { passive: false });
    } else {
      btn.addEventListener('click', trigger);
    }
  }

  setupButton('btnLeft', function() {
    if (isGameOver) return;
    if (isValidMove(currentPiece.shape, currentPiece.x - 1, currentPiece.y)) {
      currentPiece.x--;
    }
  });

  setupButton('btnRight', function() {
    if (isGameOver) return;
    if (isValidMove(currentPiece.shape, currentPiece.x + 1, currentPiece.y)) {
      currentPiece.x++;
    }
  });

  setupButton('btnRotate', function() {
    if (isGameOver) return;
    const rotated = rotatePiece(currentPiece);
    if (isValidMove(rotated, currentPiece.x, currentPiece.y)) {
      currentPiece.shape = rotated;
    }
  });

  setupButton('btnDown', function() {
    if (isGameOver) return;
    if (isValidMove(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
      currentPiece.y++;
      score += 1;
      updateUI();
    }
  });

  setupButton('btnDrop', function() {
    if (isGameOver) return;
    while (isValidMove(currentPiece.shape, currentPiece.x, currentPiece.y + 1)) {
      currentPiece.y++;
      score += 2;
    }
    lockPiece();
    updateUI();
  });

  setupButton('btnPause', function() {
    pauseGame();
  });

  setupButton('btnStart', function() {
    startGame();
  });

  setupButton('btnRestart', function() {
    startGame();
  });

  // Prevent double-tap zoom on iOS
  document.addEventListener('touchstart', function(e) {
    if (e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive: false });

  document.addEventListener('gesturestart', function(e) {
    e.preventDefault();
  });

  // Init
  createBoard();
  draw();
})();
</script>
</body>
</html>
